<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <h1 class="ShopEase">
          <a href="index.html">ShopEase</a>
        </h1>

        <ul class="links-container">
          <li><a href="#products-section">Products</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>

        <a href="checkout.html" class="cart-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="cart-icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
            />
          </svg>
          <span class="total-cart-items">0</span>
        </a>
      </nav>
    </header>

    <main class="main-container">
      <section class="hero-container">
        <div class="hero-text">
          <h1 class="hero-title">WELCOME TO SHOPEASE</h1>
          <p class="hero-para">
            Find the best products at unbeatable prices
          </p>
          <a href="#products-section" class="start-shopping">Start Shopping</a>
        </div>
      </section>
      <section class="products-section" id="products-section">
        <div class="product-grid"></div>
      </section>
      <section class="loader hideLoader">
        <p class="loading-text">Loading..., please wait !</p>
      </section>
    </main>

  <!-- Footer -->
    <footer class="footer">
      <p>Developed by Chuks &copy;2025 All rights reserved</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
